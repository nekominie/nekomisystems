<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NekomiSystems</title>
    <meta name="description" content="NekomiSystems — Software creado por pasión, no por dinero." />

    <link rel="icon" href="/logos/nekomi_icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { display: ['Spline Sans', 'sans-serif'] },
                    colors: { primary: '#4b2bee', accent: '#22d3ee' },
                },
            },
        }
    </script>

    <style>
        html, body { height: 100dvh; overflow: hidden; margin: 0; }
        body { display: flex; flex-direction: column; background: #0b0916; }

        /* ── Background blobs ── */
        .bg-decor { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .blob { position: absolute; border-radius: 9999px; filter: blur(100px); }

        .blob-1 {
            top: -20%; left: 50%; transform: translateX(-50%);
            width: 80vw; height: 80vw; max-width: 900px; max-height: 900px;
            background: radial-gradient(circle at center, rgba(75,43,238,0.5) 0%, transparent 65%);
            animation: drift 11s ease-in-out infinite;
        }
        .blob-2 {
            bottom: -15%; right: -10%;
            width: 55vw; height: 55vw; max-width: 650px; max-height: 650px;
            background: radial-gradient(circle at center, rgba(34,211,238,0.28) 0%, transparent 65%);
            animation: drift 13s ease-in-out infinite reverse;
        }
        .blob-3 {
            top: 40%; left: -8%;
            width: 40vw; height: 40vw; max-width: 500px; max-height: 500px;
            background: radial-gradient(circle at center, rgba(200,100,255,0.2) 0%, transparent 65%);
            animation: drift 16s ease-in-out infinite;
        }

        @keyframes drift {
            0%,100% { transform: translateX(-50%) translateY(0); }
            50%      { transform: translateX(-50%) translateY(-18px); }
        }
        .blob-2, .blob-3 { animation-name: float-free; }
        @keyframes float-free {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-18px); }
        }

        /* ── Glassmorphism ── */
        .glass {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* ── Logo glow (layer behind the PNG) ── */
        .logo-glow {
            position: absolute; inset: -20px;
            border-radius: 9999px;
            background: radial-gradient(
                ellipse at 60% 55%,
                rgba(34,211,238,0.30) 0%,
                rgba(75,43,238,0.25) 40%,
                rgba(200,100,255,0.12) 65%,
                transparent 80%
            );
            filter: blur(55px);
            z-index: 0;
        }

        /* Logo drop-shadow chains (cyan + pink) */
        .logo-img {
            position: relative; z-index: 1;
            filter:
                drop-shadow(0 0 18px rgba(34,211,238,0.45))
                drop-shadow(0 0 45px rgba(200,120,255,0.20));
            animation: logo-float 8s ease-in-out infinite;
        }
        @keyframes logo-float {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-14px); }
        }

        /* ── Gradient text ── */
        .text-gradient {
            background: linear-gradient(120deg, #8b7bff 0%, #4b2bee 40%, #22d3ee 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Button shimmer ── */
        .btn-shimmer {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        a.btn-primary:hover .btn-shimmer { transform: translateX(100%); }

        @media (prefers-reduced-motion: reduce) {
            .blob, .logo-img { animation: none !important; }
        }
    </style>
</head>

<body class="font-display text-gray-200 antialiased flex flex-col h-dvh overflow-hidden">

    <!-- Animated background -->
    <div class="bg-decor">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Main content -->
    <main class="relative z-10 flex flex-1 min-h-0 flex-col items-center justify-center px-6 text-center">

        <!-- Logo -->
        <div class="relative mb-4 flex items-center justify-center">
            <div class="logo-glow"></div>
            <img data-logo src="/logos/nekomisystems_logo.png" alt="Nekomisystems"
                class="logo-img w-[85vw] max-w-[560px] max-h-[30vh] sm:max-w-[640px] sm:max-h-[40vh] lg:max-w-[720px] lg:max-h-[45vh]" />
        </div>

        <!-- Eyebrow badge -->
        <span data-eyebrow
            class="mb-3 inline-block rounded-full border border-white/10 bg-white/5 px-4 py-1 text-[11px] font-semibold uppercase tracking-[0.25em] text-white/50"></span>

        <!-- Tagline -->
        <p data-tagline class="mb-6 max-w-xs text-base leading-relaxed text-white/55 sm:max-w-sm"></p>

        <!-- CTA buttons (rendered by JS) -->
        <div data-buttons class="flex flex-wrap items-center justify-center gap-4 mb-10"></div>

        <!-- Info strip -->
        <div class="glass rounded-2xl px-8 py-3">
            <p data-strip class="text-[11px] uppercase tracking-[0.22em] text-white/30"></p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 pb-4 text-center">
        <p data-footer class="text-xs text-white/20"></p>
    </footer>

    <!-- ====================================================
         CONFIG — edita libremente todo desde este objeto.
         ==================================================== -->
    <script>
        const CONFIG = {
            company: 'NekomiSystems',

            /** Ruta al logo (PNG con transparencia recomendado). */
            logo: '/logos/nekomisystems_logo.png',

            /** Badge pequeño sobre el tagline. Déjalo '' para ocultarlo. */
            eyebrow: 'Est. 2026',

            /** Frase corta bajo el logo. */
            tagline: 'Software creado por pasión, no por dinero.',

            /** Texto del strip de información inferior. */
            strip: 'Software · Creatividad · Diversión',

            /**
             * Botones principales.
             * style: 'primary'  → degradado con shimmer
             * style: 'glass'    → vidrio semi-transparente
             */
            buttons: [
                {
                    label: 'Proyectos',
                    icon: 'folder_open',
                    url: 'https://portfolio.nekomisystems.com',          // ← URL de tu futura página de proyectos
                    style: 'primary',
                },
                {
                    label: 'Fundador',
                    icon: 'person',
                    url: 'https://dev.nekomisystems.com',  // ← Landing personal del fundador
                    style: 'glass',
                },
            ],
        }

        /* ====================================================
           RENDER — normalmente no necesitas tocar esto.
           ==================================================== */
        ;(function () {
            const $ = sel => document.querySelector('[data-' + sel + ']')

            // Logo
            const logoEl = $('logo')
            logoEl.src = CONFIG.logo
            logoEl.alt = CONFIG.company

            // Eyebrow
            const eyebrowEl = $('eyebrow')
            if (CONFIG.eyebrow) {
                eyebrowEl.textContent = CONFIG.eyebrow
            } else {
                eyebrowEl.style.display = 'none'
            }

            // Tagline
            $('tagline').textContent = CONFIG.tagline

            // Strip
            $('strip').textContent = CONFIG.strip

            // Buttons
            $('buttons').innerHTML = CONFIG.buttons.map(btn => {
                if (btn.style === 'primary') {
                    return `
                    <a href="${btn.url}" class="btn-primary group relative inline-flex items-center gap-2.5 overflow-hidden rounded-full bg-gradient-to-r from-[#4b2bee] to-[#22d3ee] px-8 py-3.5 text-sm font-bold text-white shadow-lg shadow-black/40 transition-transform hover:scale-[1.04] hover:shadow-[0_0_35px_rgba(75,43,238,0.55)]">
                        <span class="btn-shimmer"></span>
                        <span class="material-symbols-outlined text-[20px] relative">${btn.icon}</span>
                        <span class="relative">${btn.label}</span>
                    </a>`
                } else {
                    return `
                    <a href="${btn.url}" class="inline-flex items-center gap-2.5 rounded-full glass px-8 py-3.5 text-sm font-bold text-white/75 transition-all hover:scale-[1.03] hover:text-white hover:bg-white/10">
                        <span class="material-symbols-outlined text-[20px]">${btn.icon}</span>
                        <span>${btn.label}</span>
                    </a>`
                }
            }).join('')

            // Footer
            $('footer').textContent = `© ${new Date().getFullYear()} ${CONFIG.company}. NekomiWorks, Todos los derechos reservados.`
        })()
    </script>
</body>
</html>
